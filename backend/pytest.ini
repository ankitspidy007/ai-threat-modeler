[pytest]
testpaths = tests

# Two lanes, because they answer different questions.
#
#   pytest -m "not slow"    does this change break anything          ~40s
#   pytest                  is this build good enough to release     ~85s
#
# The slow lane is the release gate: it re-analyzes the whole evaluation corpus
# and the held-out scenarios, which is the only way to catch a change that keeps
# every unit test green while quietly lowering recall. It runs in CI on every
# push, so marking a test slow moves it off the inner loop, not out of the build.
markers =
    slow: re-analyzes a corpus; belongs to the release gate rather than the inner loop
